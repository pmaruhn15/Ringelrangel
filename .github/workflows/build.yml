name: Build APK

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Read version
        id: version
        run: |
          source version.properties
          echo "version=${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}" >> $GITHUB_OUTPUT
          echo "build=${VERSION_BUILD}" >> $GITHUB_OUTPUT

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/ringelrangel-v${{ steps.version.outputs.version }}-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/ringelrangel-v${{ steps.version.outputs.version }}-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ringelrangel-apk-v${{ steps.version.outputs.version }}
          path: artifacts/*.apk
          retention-days: 90

      - name: Delete existing release for this version
        if: github.event_name == 'push'
        run: |
          gh release delete "v${{ steps.version.outputs.version }}" --yes || true
          git push origin :refs/tags/v${{ steps.version.outputs.version }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: github.event_name == 'push'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            artifacts/ringelrangel-v${{ steps.version.outputs.version }}-debug.apk \
            artifacts/ringelrangel-v${{ steps.version.outputs.version }}-release.apk \
            --title "Ringelrangel v${{ steps.version.outputs.version }}" \
            --notes "Automatischer Build von Commit ${{ github.sha }}" \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
